name: Build R11T kwin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'archlinux/kwin-r11t/**'
      - '.github/workflows/build-kwin.yml'
  pull_request:
    paths:
      - 'archlinux/kwin-r11t/**'
      - '.github/workflows/build-kwin.yml'

permissions:
  contents: read

concurrency:
  group: kwin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aarch64:
    name: Build aarch64 kwin package
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    env:
      # Pin the builder image so the toolchain does not drift silently between
      # runs.  Arch Linux ARM has no package archive (the only one, on
      # tardis.tiny-vps.com, shut down on 2026-06-02), so the Qt/KF6 versions
      # cannot be pinned to an exact number.  The image tag is the closest
      # available approximation; EXPECTED_QT_SYMBOL below is what actually
      # protects the phone.
      BUILD_IMAGE: menci/archlinuxarm:base-devel-20261015.38692846456
      # The R11T runs qt6-base 6.12.  KWin links Qt's private API, which is not
      # stable across minor Qt releases: a binary built against a newer Qt dies
      # on the device with
      #   symbol lookup error: /usr/lib/libkwin.so.6: undefined symbol: ...
      #   version Qt_6_PRIVATE_API
      # so a mismatch must fail the build rather than ship a dead package.
      EXPECTED_QT_SYMBOL: Qt_6.12

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Validate delivery layout
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/archlinux/kwin-r11t"
          test -f "$package_dir/PKGBUILD"
          test -f "$package_dir/0001-kwin-drm-EBUSY-retry-on-next-vblank.patch"
          bash -n "$package_dir/PKGBUILD"

      - name: Verify patch against the released kwin sources
        run: |
          set -euo pipefail
          package_dir="$GITHUB_WORKSPACE/archlinux/kwin-r11t"
          work="$RUNNER_TEMP/kwin-patch-check"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          curl -fsSLO "https://download.kde.org/stable/plasma/6.7.5/kwin-6.7.5.tar.xz"
          echo "6baa910b732d93c48c90f9c1cc685cc93d0b8de0cdf138c24192c045bc3a48e2  kwin-6.7.5.tar.xz" \
            | sha256sum -c -
          tar xf kwin-6.7.5.tar.xz
          patch --dry-run -d kwin-6.7.5 -p1 \
            -i "$package_dir/0001-kwin-drm-EBUSY-retry-on-next-vblank.patch"

      - name: Build package in Arch Linux ARM
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kwin-package"
          docker run --rm --privileged \
            --platform linux/arm64 \
            --env EXPECTED_QT_SYMBOL="$EXPECTED_QT_SYMBOL" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$BUILD_IMAGE" \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm

              package_dir=/workspace/archlinux/kwin-r11t
              output_dir=/workspace/kwin-package
              build_dir=/build/kwin

              rm -rf "$build_dir"
              install -d -m 0755 "$build_dir" "$output_dir"
              cp -a "$package_dir/." "$build_dir/"

              if ! id builder >/dev/null 2>&1; then
                useradd --create-home --shell /bin/bash builder
              fi
              printf "%s\n" "builder ALL=(ALL) NOPASSWD: ALL" \
                > /etc/sudoers.d/makepkg-builder
              chmod 0440 /etc/sudoers.d/makepkg-builder
              chown -R builder:builder "$build_dir"
              chown builder:builder "$output_dir"

              printf "PKGDEST=%s\nPKGEXT=.pkg.tar.zst\n" "$output_dir" \
                >> /etc/makepkg.conf

              runuser -u builder -- env HOME=/home/builder \
                bash -euxo pipefail -c "
                  cd \"$build_dir\"
                  makepkg --syncdeps --noconfirm --cleanbuild --log
                "

              ls -la "$output_dir"

              package="$(find "$output_dir" -maxdepth 1 -type f \
                -name "*.pkg.tar.zst" -print -quit)"
              test -n "$package"
              pacman -Qip "$package"
              pacman -Qlp "$package" | grep -F /usr/bin/kwin_wayland
              pacman -Qlp "$package" | grep -F /usr/lib/kwin

              # Fail closed if the produced compositor targets a Qt the phone
              # does not provide.  KWin links the Qt private API, which is not
              # stable across minor Qt releases, so a mismatched binary cannot
              # even start on the device.  Inspect the binary inside the package
              # so the check covers exactly what will be installed.
              rm -rf /tmp/qtcheck
              mkdir -p /tmp/qtcheck
              tar --zstd -xf "$package" -C /tmp/qtcheck usr/bin/kwin_wayland
              built_qt="$(objdump -T /tmp/qtcheck/usr/bin/kwin_wayland \
                | grep -oE "Qt_6\.[0-9]+" | sort -uV | tail -1)"
              echo "built kwin_wayland requires $built_qt, phone has $EXPECTED_QT_SYMBOL"
              if [ "$built_qt" != "$EXPECTED_QT_SYMBOL" ]; then
                echo "::error::kwin_wayland targets $built_qt but the R11T has $EXPECTED_QT_SYMBOL; it would fail with a Qt_6_PRIVATE_API symbol lookup error. Pin BUILD_IMAGE to a date whose Qt matches the phone, or run pacman -Syu on the phone first."
                exit 1
              fi

              chmod 0644 "$output_dir"/*.pkg.tar.zst
              chmod 0777 "$output_dir"
            '

      - name: Checksum and document package
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kwin-package"
          sha256sum -- *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS
          cat > INSTALL.md <<'EOF'
          # Install the R11T kwin package

          This is kwin 6.7.5 with the DRM atomic-commit EBUSY retry patch
          applied.  It replaces the distribution `kwin` package.

          1. Install the generated package:

             sudo pacman -U kwin-6.7.5-*-aarch64.pkg.tar.zst

          2. Restart the display manager so the new compositor is loaded:

             sudo systemctl restart sddm.service

          3. Verify the patched behaviour in the user journal:

             journalctl --user-unit plasma-kwin_wayland.service -b | grep -c 'atomic commit failed'

             The retry patch re-submits an EBUSY commit on the next vblank
             until a 500 ms budget is spent, which comfortably exceeds the
             ~49 ms the MSM commit worker needs to release the CRTC.  Once
             the budget runs out the existing drop path remains the fallback.

          4. Roll back with the stock package from the ALARM repository:

             sudo pacman -Sy kwin

          NOTE on Qt: pre-6.12 Qt builds of this package (kwin 6.7.5-3.1 and
          6.7.5-3.2) cannot start once the phone's qt6-base is 6.12 or newer.
          KWin links Qt's private API, which changed between Qt 6.11 and 6.12,
          so such a binary dies with a `Qt_6_PRIVATE_API` symbol lookup error
          and the screen stays on the kernel console.  Build against a Qt that
          matches the phone; this workflow fails the build when they differ.
          EOF

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwin-r11t-aarch64
          if-no-files-found: error
          retention-days: 30
          path: |
            kwin-package/*.pkg.tar.zst
            kwin-package/SHA256SUMS
            kwin-package/INSTALL.md
