name: OPPO R11T selective build (manual)

on:
  workflow_dispatch:
    inputs:
      check_dir:
        description: "快速语法检查目录（留空=跳过）。例：drivers/cpufreq/  或  drivers/cpufreq/ sound/soc/codecs/"
        type: string
        default: "drivers/cpufreq/"
      build_boot:
        description: "生成 boot（Image + sdm660-oppo-r11t.dtb）"
        type: boolean
        default: false
      build_modules:
        description: "生成 modules 归档"
        type: boolean
        default: false
      modules_scope:
        description: "modules 构建范围"
        type: choice
        default: all
        options:
          - all
          - cpufreq
          - custom
      modules_custom_m:
        description: "仅 modules_scope=custom 时生效，填 M= 的目录，空格分隔"
        type: string
        default: ""
      make_jobs:
        description: "并行度 -j，留空=自动 nproc"
        type: string
        default: ""

env:
  ARCH: arm64
  CROSS: aarch64-linux-gnu-
  LOCALV: -sdm660-gcc+

jobs:
  quick-check:
    name: Quick syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    if: ${{ inputs.check_dir != '' }}
    steps:
      - name: Checkout deployment (self)
        uses: actions/checkout@v4
        with:
          path: deploy
      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          repository: mv600/linux-sdm660-oppor11-t
          ref: qcom-sdm660-7.0.y
          path: deploy/linux
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio rsync xz-utils bzip2 \
            device-tree-compiler gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross libssl-dev libelf-dev python3-pip kmod
      - name: Configure
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= sdm660_defconfig
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
          ./scripts/config --file build/.config \
            --set-str LOCALVERSION "$LOCALV" --disable LOCALVERSION_AUTO
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
      - name: Prepare (generate asm-offsets.h / prepare)
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" prepare
          test -f build/include/generated/asm-offsets.h || { echo "::error::asm-offsets.h missing"; exit 1; }
      - name: Compile check only (no link, no packaging)
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          # 目录目标：只编译 .o，不链接 .ko、不跑 modpost，几分钟内有语法/类型报错
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
            -j"$J" ${{ inputs.check_dir }}
      - name: Summary
        run: |
          echo "OK: 语法检查通过 [${{ inputs.check_dir }}]"

  build:
    name: Build artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: [quick-check]
    if: ${{ always() && (inputs.build_boot || inputs.build_modules) && needs.quick-check.result != 'failure' }}
    steps:
      - name: Checkout deployment (self)
        uses: actions/checkout@v4
        with:
          path: deploy
      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          repository: mv600/linux-sdm660-oppor11-t
          ref: qcom-sdm660-7.0.y
          path: deploy/linux
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio rsync xz-utils bzip2 \
            device-tree-compiler gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross libssl-dev libelf-dev python3-pip kmod
      - name: Configure
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= sdm660_defconfig
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
          ./scripts/config --file build/.config \
            --set-str LOCALVERSION "$LOCALV" --disable LOCALVERSION_AUTO
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
      - name: Build boot
        if: ${{ inputs.build_boot }}
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
            -j"$J" Image qcom/sdm660-oppo-r11t.dtb
          ls -la build/arch/arm64/boot/Image \
                  build/arch/arm64/boot/dts/qcom/sdm660-oppo-r11t.dtb
      - name: Build modules
        if: ${{ inputs.build_modules }}
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          SCOPE="${{ inputs.modules_scope }}"
          case "$SCOPE" in
            all)
              make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
                -j"$J" modules
              ;;
            cpufreq)
              make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
                -j"$J" KBUILD_MODPOST_WARN=1 M=drivers/cpufreq modules
              ;;
            custom)
              M="${{ inputs.modules_custom_m }}"
              if [ -z "$M" ]; then
                echo "::error::modules_scope=custom 时 modules_custom_m 不能为空"
                exit 1
              fi
              make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
                -j"$J" KBUILD_MODPOST_WARN=1 M="$M" modules
              ;;
          esac
      - name: Install + archive module set
        if: ${{ inputs.build_modules }}
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          REL=$(make -s O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= kernelrelease)
          VER=$(make -s O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= kernelversion)
          if [ "$REL" != "$VER$LOCALV" ]; then
            echo "::error::kernel release mismatch: got $REL want $VER$LOCALV"
            exit 1
          fi
          echo "kernel_release=$REL" >> "$GITHUB_ENV"
          rm -rf out/modroot
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
            modules_install INSTALL_MOD_PATH="$PWD/out/modroot" INSTALL_MOD_STRIP=1
          rm -f "out/modroot/lib/modules/$REL/build" "out/modroot/lib/modules/$REL/source"
          depmod -b out/modroot "$REL"
          tar --zstd -cf "$GITHUB_WORKSPACE/modules-r11t-gcc.tar.zst" \
            -C out/modroot "lib/modules/$REL"
          echo "--- 归档内容 ---"
          tar --zstd -tvf "$GITHUB_WORKSPACE/modules-r11t-gcc.tar.zst" | head -20
      - name: Upload module archive
        if: ${{ inputs.build_modules }}
        uses: actions/upload-artifact@v4
        with:
          name: modules-r11t-gcc
          if-no-files-found: error
          path: modules-r11t-gcc.tar.zst
      - name: Upload boot artifacts
        if: ${{ inputs.build_boot }}
        uses: actions/upload-artifact@v4
        with:
          name: oppo-r11t-boot
          if-no-files-found: error
          path: |
            deploy/linux/build/arch/arm64/boot/Image
            deploy/linux/build/arch/arm64/boot/dts/qcom/sdm660-oppo-r11t.dtb
