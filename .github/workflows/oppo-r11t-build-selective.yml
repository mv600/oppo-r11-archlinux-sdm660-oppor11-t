name: OPPO R11T selective build (manual)

on:
  workflow_dispatch:
    inputs:
      check_dir:
        description: "快速语法检查目录（留空=跳过）. 例：drivers/cpufreq/  或  drivers/cpufreq/ sound/soc/codecs/"
        type: string
        default: "drivers/cpufreq/"
      build_boot:
        description: "生成 boot（Image + sdm660-oppo-r11t.dtb）"
        type: boolean
        default: false
      build_full_modules:
        description: "生成完整 modules-r11t-gcc.tar.zst（全量 modules，耗时 ~50-90 分钟）"
        type: boolean
        default: false
      make_jobs:
        description: "并行度 -j，留空=自动 nproc"
        type: string
        default: ""

env:
  ARCH: arm64
  CROSS: aarch64-linux-gnu-
  LOCALV: -sdm660-gcc+

jobs:
  quick-check:
    name: Quick syntax check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ inputs.check_dir != '' }}
    steps:
      - name: Checkout deployment (self)
        uses: actions/checkout@v4
        with:
          path: deploy
      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          repository: mv600/linux-sdm660-oppor11-t
          ref: qcom-sdm660-7.0.y
          path: deploy/linux
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio rsync xz-utils bzip2 \
            device-tree-compiler gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross libssl-dev libelf-dev python3-pip kmod
      - name: Configure
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= sdm660_defconfig
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
          ./scripts/config --file build/.config \
            --set-str LOCALVERSION "$LOCALV" --disable LOCALVERSION_AUTO
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
      - name: Prepare (generate asm-offsets.h)
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" prepare
          test -f build/include/generated/asm-offsets.h || { echo "::error::asm-offsets.h missing"; exit 1; }
      - name: Compile directory targets (syntax-only)
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" ${{ inputs.check_dir }}
      - name: Summary
        run: |
          echo "OK: syntax check passed for ${{ inputs.check_dir }}"

  build-boot-only:
    name: Build boot only
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [quick-check]
    if: ${{ always() && inputs.build_boot && needs.quick-check.result != 'failure' }}
    steps:
      - name: Checkout deployment (self)
        uses: actions/checkout@v4
        with:
          path: deploy
      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          repository: mv600/linux-sdm660-oppor11-t
          ref: qcom-sdm660-7.0.y
          path: deploy/linux
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio rsync xz-utils bzip2 \
            device-tree-compiler gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross libssl-dev libelf-dev python3-pip kmod
      - name: Configure
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= sdm660_defconfig
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
          ./scripts/config --file build/.config \
            --set-str LOCALVERSION "$LOCALV" --disable LOCALVERSION_AUTO
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
      - name: Prepare
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" prepare
          test -f build/include/generated/asm-offsets.h || { echo "::error::asm-offsets.h missing"; exit 1; }
      - name: Build static aarch64 busybox
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -fsSL -o busybox.tar.bz2 https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar xf busybox.tar.bz2 && cd busybox-1.36.1
          make defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # tc is broken with new kernel UAPI headers (TCA_CBQ_* removed);
          # not needed in the initramfs.
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          make oldconfig </dev/null >/dev/null 2>&1
          make -j"$(nproc)" CROSS_COMPILE=aarch64-linux-gnu-
      - name: Build kernel Image.gz + dtb
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" Image.gz qcom/sdm660-oppo-r11t.dtb
      - name: Verify kernel release (sdm660-gcc+)
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          REL=$(cat build/include/config/kernel.release)
          VER=$(make -s O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= kernelversion)
          if [ "$REL" != "$VER$LOCALV" ]; then
            echo "::error::kernel release mismatch: got $REL want $VER$LOCALV"
            exit 1
          fi
          echo "kernel release: $REL"
      - name: Build boot initramfs (busybox + init.arch)
        run: |
          cd "$GITHUB_WORKSPACE"
          IR=$GITHUB_WORKSPACE/initramfs-root
          rm -rf "$IR"
          mkdir -p "$IR"/{bin,dev,proc,sys,newroot}
          cp busybox-1.36.1/busybox "$IR/bin/busybox"
          aarch64-linux-gnu-strip "$IR/bin/busybox"
          cp deploy/initramfs/init.arch "$IR/init"
          chmod 0755 "$IR/init"
          ( cd "$IR" && find . -print0 | cpio --null -ov --format=newc ) | \
            gzip -9 > deploy/linux/build/r11t-arch-initramfs.cpio.gz
      - name: Pack Image.gz-dtb
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux/build"
          cp arch/arm64/boot/Image.gz Image.gz-dtb
          dd if=arch/arm64/boot/dts/qcom/sdm660-oppo-r11t.dtb \
            of=Image.gz-dtb oflag=append conv=notrunc status=none
      - name: mkbootimg
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf mkbootimg
          git clone --depth 1 https://github.com/osm0sis/mkbootimg
          cd mkbootimg
          # osm0sis/mkbootimg builds with -Werror; new gcc turns its
          # warnings into errors, so drop -Werror. Use host cc (x86_64).
          sed -i 's/-Werror//g' Makefile libmincrypt/Makefile
          make
          ./mkbootimg --kernel "$GITHUB_WORKSPACE/deploy/linux/build/Image.gz-dtb" \
            --ramdisk "$GITHUB_WORKSPACE/deploy/linux/build/r11t-arch-initramfs.cpio.gz" \
            --pagesize 4096 --base 0x80000000 \
            --kernel_offset 0x00008000 --ramdisk_offset 0x03000000 \
            --second_offset 0x00f00000 --tags_offset 0x00000100 \
            --header_version 1 --os_version 9.0.0 --os_patch_level 2019-09 \
            --cmdline 'console=tty0 console=ttyMSM0,115200n8 earlycon=msm_serial_dm,0xc170000 loglevel=7 panic=10 root=PARTLABEL=userdata rootfstype=btrfs rootflags=subvol=@,compress=zstd:3,noatime,space_cache=v2 rootwait rw rdinit=/init' \
            -o "$GITHUB_WORKSPACE/boot-r11t-arch.img"
      - name: Verify boot header + size
        run: |
          [ "$(dd if=boot-r11t-arch.img bs=8 count=1 status=none)" = 'ANDROID!' ]
          size=$(stat -c%s boot-r11t-arch.img)
          [ "$size" -le 67108864 ]
          [ $((size % 4096)) -eq 0 ] || { echo "::error::not page-aligned: $size"; exit 1; }
          echo "boot-r11t-arch.img: $size bytes"
          sha256sum boot-r11t-arch.img
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oppo-r11t-arch-boot
          if-no-files-found: error
          path: boot-r11t-arch.img

  build-full-modules:
    name: Build full modules (slow)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    needs: [quick-check]
    if: ${{ always() && inputs.build_full_modules && needs.quick-check.result != 'failure' }}
    steps:
      - name: Checkout deployment (self)
        uses: actions/checkout@v4
        with:
          path: deploy
      - name: Checkout kernel fork
        uses: actions/checkout@v4
        with:
          repository: mv600/linux-sdm660-oppor11-t
          ref: qcom-sdm660-7.0.y
          path: deploy/linux
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio rsync xz-utils bzip2 \
            device-tree-compiler gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross libssl-dev libelf-dev python3-pip kmod
      - name: Configure
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= sdm660_defconfig
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
          ./scripts/config --file build/.config \
            --set-str LOCALVERSION "$LOCALV" --disable LOCALVERSION_AUTO
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= olddefconfig
      - name: Prepare
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" prepare
          test -f build/include/generated/asm-offsets.h || { echo "::error::asm-offsets.h missing"; exit 1; }
      - name: Build modules (full)
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          J="${{ inputs.make_jobs }}"
          [ -z "$J" ] && J="$(nproc)"
          # Need vmlinux so that modules.builtin / modules.builtin.modinfo
          # are generated; otherwise `make modules_install` fails with
          # "No rule to make target 'modules.builtin'".
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= -j"$J" vmlinux modules
        env:
          KBUILD_MODPOST_WARN: "1"
      - name: Install + archive modules
        run: |
          cd "$GITHUB_WORKSPACE/deploy/linux"
          REL=$(make -s O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= kernelrelease)
          VER=$(make -s O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= kernelversion)
          if [ "$REL" != "$VER$LOCALV" ]; then
            echo "::error::kernel release mismatch: got $REL want $VER$LOCALV"
            exit 1
          fi
          rm -rf out/modroot
          make O=build ARCH=$ARCH CROSS_COMPILE=$CROSS LOCALVERSION= \
            modules_install INSTALL_MOD_PATH="$PWD/out/modroot" INSTALL_MOD_STRIP=1
          rm -f "out/modroot/lib/modules/$REL/build" "out/modroot/lib/modules/$REL/source"
          depmod -b out/modroot "$REL"
          tar --zstd -cf "$GITHUB_WORKSPACE/modules-r11t-gcc.tar.zst" \
            -C out/modroot "lib/modules/$REL"
      - name: Upload module archive
        uses: actions/upload-artifact@v4
        with:
          name: modules-r11t-gcc
          if-no-files-found: error
          path: modules-r11t-gcc.tar.zst
