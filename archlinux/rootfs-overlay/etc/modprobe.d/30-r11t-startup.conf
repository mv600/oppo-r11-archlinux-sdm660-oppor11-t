# These drivers must start only after firmware and Qualcomm file services.
blacklist qcom_q6v5_mss
blacklist qcom_q6v5_pas
blacklist ath10k_snoc

# 注意：这里**不要**加 blacklist nxp-nci。
# 它曾经被加过，理由是 NFC 的 IRQ 会造成 ~52k 次/秒的中断风暴 —— 那是 DT 里
# interrupts = <28 IRQ_TYPE_LEVEL_HIGH> 的后果。真正的解法在 DT 侧：
# sdm660-oppo-r11t.dts 的 nq@28 已改成 IRQ_TYPE_EDGE_RISING，并把 compatible
# 换回上游的 "nxp,nxp-nci-i2c"（驱动侧不再有分叉）。
# 电平长期为高时不再产生边沿，风暴结构上不可能发生。
# blacklist 会让驱动根本不加载，NFC 就一定用不了，所以撤掉。

# qcom_r11t_osm_cpufreq: default to LIVE DVFS and the validated APM path.
#
# 驱动自身的默认值是 dryrun=1，即只填 LUT、不动硬件，频率停在 bootloader 留下的
# 那一档。要真正调频必须 dryrun=0，而它只能通过 modprobe 参数在**加载时**设定
# （写 /sys/module/.../parameters/dryrun 只是翻那个 bool，硬件表不会被重建）。
# 所以默认值只能放这里。
#
# apm=1 已经在修复 base_phys 后通过 apm=2 地址预览、apm=1 实际写回、profile A/B、
# 满载和冷启动复核；预览与实际写入地址为 pwrcl=0x179c0304、perfcl=0x179c2304。
# 仍然只保留这两个模块参数，其他驱动参数继续使用驱动默认值。
options qcom_r11t_osm_cpufreq dryrun=0 apm=1
